<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Not Found - HackTrack</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }
        .notfound-card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 480px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }
        .icon {
            font-size: 3.5rem;
            color: #EF4444;
            margin-bottom: 16px;
        }
        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .btn-home {
            background-color: #38BDF8;
            color: #0F172A;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<div class="notfound-card">
    <div class="icon">
        <i class="bi bi-exclamation-octagon-fill"></i>
    </div>
    <h3 class="title">Team Record Not Found</h3>
    <p class="text-secondary small mb-3">
        The team ID <code class="text-info fs-6">{{ team_id }}</code> could not be found in the hackathon database.
    </p>
    <p class="text-muted small">
        Please check if the team has been registered by event organizers, or scan the official QR code again.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn-home">
        <i class="bi bi-box-arrow-in-right me-1"></i> Go to Portal Login
    </a>
</div>

</body>
</html>
