<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - HackTrack</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .success-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            padding: 3rem;
            text-align: center;
        }

        @media (max-width: 576px) {
            .success-card {
                padding: 1.5rem;
            }
        }

        .success-icon {
            width: 72px;
            height: 72px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            color: #10b981;
            font-size: 2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .team-id-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-primary);
            font-family: monospace;
            font-size: 1.25rem;
            font-weight: 700;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: inline-block;
            margin: 1rem 0;
        }

        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: inline-block;
            margin: 1.5rem 0;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .btn-portal {
            background: var(--accent-gradient);
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            padding: 0.85rem;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-portal:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(56, 189, 248, 0.5);
            color: #0f172a;
        }

        .btn-download-qr {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-weight: 600;
            border-radius: 12px;
            padding: 0.85rem;
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-bottom: 0.75rem;
        }

        .btn-download-qr:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-check2"></i>
        </div>
        
        <h3 class="fw-bold mb-1">Registration Successful</h3>
        <p class="text-secondary small">Your team is registered for the HackTrack Hackathon.</p>
        
        <h4 class="text-white mt-4 mb-0">{{ team.team_name }}</h4>
        <div class="team-id-badge">{{ team.team_id }}</div>
        
        <div>
            <div class="qr-container">
                <img id="qr-image" src="{{ url_for('static', filename='qrcodes/team_' ~ team.team_id ~ '_qr.png') }}" alt="Team QR Code" width="200" height="200">
            </div>
        </div>
        
        <p class="text-secondary small mb-4 px-md-4">
            <i class="bi bi-info-circle me-1"></i> Scan or download this QR code. It provides direct, login-free access to your team's tracking portal.
        </p>

        <div class="d-flex flex-column gap-2 max-width-350 mx-auto">
            <a href="{{ url_for('static', filename='qrcodes/team_' ~ team.team_id ~ '_qr.png') }}" download="team_{{ team.team_id }}_qr.png" class="btn btn-download-qr">
                <i class="bi bi-download"></i> Save QR Image
            </a>
            
            <a href="{{ url_for('leader.quick_edit', team_id=team.team_id) }}" class="btn btn-portal">
                <i class="bi bi-box-arrow-up-right"></i> Go to Team Portal <i class="bi bi-arrow-right"></i>
            </a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Automatically trigger opening the QR in a new tab quickly
            setTimeout(function() {
                try {
                    let qrUrl = "{{ url_for('static', filename='qrcodes/team_' ~ team.team_id ~ '_qr.png') }}";
                    window.open(qrUrl, '_blank');
                } catch(e) {
                    console.log("Popup blocked or failed: ", e);
                }
            }, 500);
        });
    </script>
</body>
</html>
