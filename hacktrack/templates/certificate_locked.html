<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate Locked - HackTrack</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts Outfit & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .locked-card {
            background-color: #1E293B;
            border: 1px solid #334155;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 520px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
        }

        .lock-icon {
            font-size: 3.5rem;
            color: #F59E0B;
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: #F8FAFC;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #94A3B8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .details-box {
            background-color: #0F172A;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
            font-size: 0.88rem;
        }

        .badge-locked {
            background-color: rgba(239, 68, 68, 0.2);
            color: #EF4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            display: inline-block;
        }

        .btn-action {
            background-color: #38BDF8;
            color: #0F172A;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-action:hover {
            background-color: #0EA5E9;
            color: #0F172A;
        }
    </style>
</head>
<body>

<div class="locked-card">
    <div class="lock-icon">
        <i class="bi bi-lock-fill"></i>
    </div>
    
    <h3 class="title">Certificate Access Locked</h3>
    <p class="subtitle">
        Certificates for <strong>{{ cert.team_name }}</strong> are currently locked. Event organizers have not yet released official certificates.
    </p>

    <div class="details-box">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-secondary">Student Name:</span>
            <strong class="text-white">{{ cert.student_name }}</strong>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="text-secondary">Certificate ID:</span>
            <code style="color: #38BDF8;">{{ cert.certificate_id }}</code>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <span class="text-secondary">Access Status:</span>
            <span class="badge-locked"><i class="bi bi-shield-lock-fill me-1"></i> LOCKED BY ORGANIZERS</span>
        </div>
    </div>

    <a href="{{ url_for('leader.quick_edit', team_id=cert.team_id) }}" class="btn-action">
        <i class="bi bi-arrow-left me-1"></i> Back to Team Portal
    </a>
</div>

<script>
    // Trap back button to prevent exposing admin/organizer session
    history.pushState(null, null, document.URL);
    window.addEventListener('popstate', function () {
        {% if current_user.is_authenticated and current_user.role in ['Admin', 'Organizer'] %}
            window.location.href = "{{ url_for('auth.logout') }}";
        {% else %}
            history.pushState(null, null, document.URL);
        {% endif %}
    });
</script>
</body>
</html>
